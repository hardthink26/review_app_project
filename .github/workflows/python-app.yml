# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "main", "deploy"] 
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.13
      uses: actions/setup-python@v7.1.0
      with:
        python-version: "3.13"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      shell: bash
      run: |
        mkdir -p logs
        pytest tests/test_basic.py 2>&1 | tee logs/pytest.log
    - name: Upload test logs
      if: always()
      uses: actions/upload-artifact@v7.0.2
      with:
        name: python-logs
        path: logs/pytest.log
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v6.3.0
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ap-southeast-2
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2
    - name: Build, tag, and push docker image to Amazon ECR
      env:
        REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        REPOSITORY: review-app-project
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build --platform linux/amd64 -t $REGISTRY/$REPOSITORY:$IMAGE_TAG .
        docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG
    - name: test SSM connection
      run: | 
        COMMAND_ID=$(
        aws ssm send-command \
        --instance-ids i-0e7fa2fce8cae9f5d \
        --document-name "AWS-RunShellScript" \
        --parameters 'commands=["whoami", "pwd"]' \
        --region ap-southeast-2 \
        --query 'Command.CommandId' \
        --output text
        )
        echo "$COMMAND_ID" 
        aws ssm wait command-executed \
        --command-id "$COMMAND_ID" \
        --instance-id i-0e7fa2fce8cae9f5d \
        --region ap-southeast-2 
  
  
        
      
