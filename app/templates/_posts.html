 <h2>post list</h2>
    <ul class="posts">
    {% for post in posts %} 
        <li class="post">
            <div class="post-date">{{ moment(post.timestamp).fromNow() }}</div> 
            <div class="post-author">
                <a href="{{ url_for('.user_profile', username=post.author.username) }}">
                    {{ post.author.username }}
                </a>
            </div> 
            <div class="post-body">{{ post.body }}</div>
        </li>
    {% endfor %} 
    </ul>
